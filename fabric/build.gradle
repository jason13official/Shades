plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation 'com.electronwill.night-config:toml:3.6.0'
    include 'com.electronwill.night-config:core:3.6.0'
    include 'com.electronwill.night-config:toml:3.6.0'

    implementation "curse.maven:forge-config-api-port-547434:8218664"
    implementation "curse.maven:shoulder-surfing-reloaded-243190:8445148"

    // Trinkets (optional accessory-slot support; not required to run the mod, compile-only here
    // and only pulled onto the classpath for local dev-run testing via modLocalRuntime)
    // implementation "maven.modrinth:trinkets-updated:4.0.0-beta.3+26.1"
    compileOnly "maven.modrinth:trinkets-updated:4.0.0-beta.3+26.1"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:8.0.1"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:8.0.1"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
